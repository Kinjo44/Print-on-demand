<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commande d'impression 3D</title>
    <meta
      name="description"
      content="Déposez une demande d'impression 3D en filament ou en résine avec vos fichiers STL/STEP."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Kinjo3DX">
      <a class="brand" href="index.html" aria-label="Accueil Kinjo3DX">
        <span class="brand-logo" aria-hidden="true">K3D</span>
        <span class="brand-name">Kinjo3DX</span>
      </a>
    </header>

    <main class="page-shell">
      <section class="form-card" aria-labelledby="form-title">
        <div class="form-heading">
          <p class="eyebrow">Demande de devis</p>
          <h2 id="form-title">Votre commande</h2>
          <p>Les informations seront envoyées automatiquement à cyclone44@wanadoo.fr.</p>
        </div>

        <form id="order-form" action="send-order.php" method="post" enctype="multipart/form-data" novalidate>
          <div class="grid two-columns">
            <label>
              <span>Nom *</span>
              <input type="text" name="nom" autocomplete="family-name" required />
            </label>

            <label>
              <span>Prénom *</span>
              <input type="text" name="prenom" autocomplete="given-name" required />
            </label>
          </div>

          <label>
            <span>Description du besoin *</span>
            <textarea name="description" rows="5" placeholder="Dimensions, usage de la pièce, contraintes mécaniques, quantité souhaitée..." required></textarea>
          </label>

          <label class="file-drop">
            <span>Fichier(s) à imprimer * (.stl ou .step)</span>
            <input id="files" type="file" name="fichiers[]" accept=".stl,.step" multiple required />
            <small>Vous pouvez sélectionner plusieurs fichiers depuis votre ordinateur.</small>
          </label>
          <p id="file-error" class="error-message" role="alert" aria-live="polite"></p>

          <div class="grid two-columns">
            <fieldset>
              <legend>Niveau d'urgence *</legend>
              <label class="choice"><input type="radio" name="urgence" value="Standard" required /> Standard</label>
              <label class="choice"><input type="radio" name="urgence" value="Rapide" /> Rapide</label>
              <label class="choice"><input type="radio" name="urgence" value="Très urgent" /> Très urgent</label>
              <label class="choice"><input type="radio" name="urgence" value="Critique" /> Critique</label>
            </fieldset>

            <fieldset>
              <legend>Technologie souhaitée *</legend>
              <label class="choice"><input type="radio" name="technologie" value="Filament" required /> Filament</label>
              <label class="choice"><input type="radio" name="technologie" value="Résine" /> Résine</label>
            </fieldset>
          </div>

          <label>
            <span>Couleur de préférence</span>
            <input type="text" name="couleur" placeholder="Ex. noir mat, blanc, transparent..." />
          </label>

          <label>
            <span>Commentaire</span>
            <textarea name="commentaire" rows="4" placeholder="Informations complémentaires, adresse de livraison, disponibilité..."></textarea>
          </label>

          <button type="submit">Envoyer la demande</button>
          <p class="form-note">* Champs obligatoires. Les fichiers non STL/STEP sont refusés.</p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
